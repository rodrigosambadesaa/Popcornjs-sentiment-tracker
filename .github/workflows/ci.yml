name: Security and regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q server.py helpers.py tests
      - name: JavaScript syntax and timeline tests
        run: |
          node --check static/app.js
          node --test tests/timeline.test.cjs
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt
